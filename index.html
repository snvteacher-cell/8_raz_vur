<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2747a8">
<title>Раціональні вирази: підготовка до контрольної</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Nunito:wght@400;600;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --fg:#1b2333; --muted:#5b6578; --line:#d3d9e4; --grid:#e3eaf5;
  --ink:#2747a8; --ink-soft:#e6ecfa;
  --f1:#d4520f; --f1-soft:#fde9dc; --f2:#0a7d6c; --f2-soft:#d9f2ee;
  --ok:#1f8a4c; --ok-soft:#dff1e6; --bad:#c2312d; --bad-soft:#f9e0de; --gold:#c98a00; --gold-soft:#fbf0d3;
  --display:"Rubik","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --math:"PT Serif","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#1a202b; --fg:#e7ebf3; --muted:#a2acbd; --line:#2e3646; --grid:#242c3a;
  --ink:#8fa8ff; --ink-soft:#212b45;
  --f1:#ff9a5c; --f1-soft:#3c2618; --f2:#4fd1bc; --f2-soft:#163632;
  --ok:#5ccb8b; --ok-soft:#183626; --bad:#ff7d72; --bad-soft:#3e1f1d; --gold:#ffc94d; --gold-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202b; --fg:#e7ebf3; --muted:#a2acbd; --line:#2e3646; --grid:#242c3a;
  --ink:#8fa8ff; --ink-soft:#212b45;
  --f1:#ff9a5c; --f1-soft:#3c2618; --f2:#4fd1bc; --f2-soft:#163632;
  --ok:#5ccb8b; --ok-soft:#183626; --bad:#ff7d72; --bad-soft:#3e1f1d; --gold:#ffc94d; --gold-soft:#3a2f12; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.5;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:22px 48px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,4vw,2.3rem);line-height:1.15;margin:0 0 4px;text-wrap:balance}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 16px}
.tab{font:inherit;font-weight:800;font-size:1rem;padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab b{font-family:var(--display);font-weight:500;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:.9rem}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab[aria-selected="true"] b{border-color:var(--surface)}
button:focus-visible,input:focus-visible{outline:3px solid var(--f1);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px)}
h2{font-family:var(--display);font-weight:500;font-size:1.35rem;margin:0 0 14px;text-wrap:balance}
.h2n{font-family:var(--body);font-weight:600;font-size:.95rem;color:var(--muted)}
h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0 0 8px}
.btn{font:inherit;font-weight:800;font-size:1rem;padding:10px 16px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.main{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.hint{border-color:var(--gold);background:var(--gold-soft)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.note{margin-top:12px;color:var(--muted);font-size:.95rem}

/* математика */
.mx{font-family:var(--math)}
.mx i{font-style:italic}
.mx sup{font-size:.68em;vertical-align:.75em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:2px 3px;line-height:1.3}
.fr>span{padding:0 4px;white-space:nowrap}
.fr>span+span{border-top:1.6px solid currentColor}
.br{display:inline-block;font-size:2.1em;line-height:1;vertical-align:middle;font-weight:400;transform:scaleY(1.12);margin:0 1px;position:relative;top:-.06em}
sup.hi{font-size:.75em!important;vertical-align:1.7em!important}
.expr{font-size:1.32rem;margin:6px 0 14px;padding:10px 14px;border-radius:12px;background:var(--ink-soft);display:inline-block;max-width:100%;overflow-x:auto;line-height:2}
.ttext{font-size:1.1rem;margin:4px 0 6px}

/* пояснення */
.theory{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:18px;align-items:start}
.topics{display:grid;gap:8px}
.fam{font:inherit;font-weight:800;font-size:.95rem;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);padding:6px 12px 6px 6px;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px;text-align:left}
.fam .ic{flex:none;width:40px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--ink);font-family:var(--math);font-size:1.05rem;font-weight:700;border:2px solid var(--line)}
.fam[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.fam[aria-pressed="true"] .ic{border-color:var(--surface)}
.props{display:grid;gap:8px;margin-bottom:12px}
.props button{font:inherit;font-size:1rem;font-weight:600;text-align:left;padding:9px 12px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;line-height:1.9}
.props button b{font-family:var(--display);font-weight:500;color:var(--ink);margin-right:4px}
.props button[aria-pressed="true"]{border-color:var(--f1);background:var(--f1-soft)}
.board{border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-height:150px;
  background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px}
.bl{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:5px 0;animation:bin .45s ease}
.bl .m{font-size:1.3rem;line-height:2.1}
.bl .cm{font-size:.92rem;font-weight:800;color:var(--f2)}
.bl.fin .m{color:var(--ink);font-weight:700}
@keyframes bin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* завдання */
.progress{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-weight:800;color:var(--muted);font-size:.95rem;margin-bottom:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.dots i{width:22px;height:9px;border-radius:99px;background:var(--line);cursor:pointer}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--ink)} .dots i.help{background:var(--gold)}
.task1{max-width:760px}
.lvl{font-family:var(--body);font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:var(--fg);border:1px solid var(--gold);vertical-align:middle;margin-left:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;max-width:620px}
.opts button{font:inherit;font-weight:800;font-size:1.05rem;padding:10px 12px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:left}
.opts button .mx{font-size:1.2rem;font-weight:400}
.opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-soft)}
.opts button.right{background:var(--ok-soft);border-color:var(--ok)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opts button:disabled{cursor:default}
.tpl{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:1.3rem;line-height:2.2;margin:4px 0 0}
.tpl .lb{font-family:var(--body);font-size:1rem;font-weight:800;color:var(--muted);margin-right:4px}
.tpl input{font-family:var(--body);font-weight:800;font-size:1.05rem;width:2.7em;height:38px;text-align:center;padding:2px;border:2px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);vertical-align:middle}
.tpl sup{vertical-align:1.05em;margin-left:2px;font-size:1rem}
.tpl sup input{width:2.1em;height:30px;font-size:.9rem;vertical-align:baseline}
.tpl .fr>span{padding:3px 4px}
.tpl input.act{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.tpl input.ok{border-color:var(--ok);background:var(--ok-soft)}
.tpl input.no{border-color:var(--bad);background:var(--bad-soft)}
.tv{display:inline-block;min-width:1.2em;padding:0 4px;border-radius:6px;background:var(--gold-soft);font-family:var(--body);font-weight:800;font-size:.9em}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:330px;margin-top:12px}
.kp button{font:inherit;font-weight:800;font-size:1.25rem;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;touch-action:manipulation}
.kp button:active{background:var(--ink-soft);border-color:var(--ink)}
.kp .w{grid-column:span 2;font-size:1rem}
.kp .del{color:var(--bad)}
.steps{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.steps li{padding:8px 12px;border-radius:10px;background:var(--gold-soft);border-left:4px solid var(--gold);font-size:1rem;line-height:2}
.steps li b{color:var(--gold)}
.steps .mx{font-size:1.15rem}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:1rem;line-height:1.9}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)} .fb.info{background:var(--gold-soft)}
.fb .ttl{font-weight:800;display:block;line-height:1.5}
.fb .mx{font-size:1.15rem}
.final{text-align:center;padding:10px 0}
.final .big{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1.1;color:var(--ink)}
.final p{margin:6px 0}

/* контрольна */
.exbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.exbar button{font:inherit;font-weight:800;font-size:.85rem;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:0}
.exbar button.ans{background:var(--ink-soft);border-color:var(--ink)}
.exbar button.cur{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.rules{margin:0 0 14px;padding-left:1.2em;font-size:.95rem}
.rules li{margin:4px 0}
.namebox{display:grid;gap:8px;margin:0 0 14px;max-width:420px}
.namebox label{font-weight:800;display:grid;gap:4px}
.namebox input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.lvhead{font-family:var(--display);font-weight:500;color:var(--f1);font-size:.95rem;margin:0 0 4px}
.review{display:grid;gap:8px;margin-top:14px;text-align:left}
.review div{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.98rem;line-height:2}
.review div.ok{border-color:var(--ok)} .review div.part{border-color:var(--gold)} .review div.no{border-color:var(--bad)}
.review b{display:block;line-height:1.5}
.review .mx{font-size:1.12rem}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-200px);visibility:hidden;transition:transform .35s;z-index:30;background:var(--gold);color:#1b1400;font-weight:800;padding:10px 18px;border-radius:99px;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.author{margin:18px 0 0;font-size:.75rem;color:var(--muted);opacity:.6;text-align:left}

@media (max-width:820px){.theory{grid-template-columns:minmax(0,1fr);gap:12px}.topics{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
  body{font-size:17px}
  .wrap{padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
  header h1{font-size:1.35rem}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.07)}
  .tab{border:0;border-radius:12px;padding:5px 2px;font-size:.78rem;font-weight:700;flex-direction:column;gap:2px;background:transparent;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;justify-content:center}
  .tab b{width:30px;height:30px;font-size:1rem}
  .tab[aria-selected="true"]{background:var(--ink-soft);color:var(--ink)}
  .tab[aria-selected="true"] b{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .panel{margin-top:12px;padding:16px 12px;border-radius:16px}
  h2{font-size:1.2rem}
  .fam{font-size:.85rem;padding:4px 8px 4px 4px;gap:7px}
  .fam .ic{width:34px;height:30px;font-size:.95rem}
  .expr{font-size:1.15rem;padding:8px 10px}
  .bl .m{font-size:1.12rem}
  .opts{grid-template-columns:1fr}
  .row-btns .btn{flex:1 1 auto}
  .tpl{font-size:1.15rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Раціональні вирази: готуємось до контрольної</h1></header>

  <nav class="tabs" role="tablist" aria-label="Розділи тренажера">
    <button class="tab" role="tab" id="t-th" aria-controls="p-th" aria-selected="true"><b>1</b>Пояснення</button>
    <button class="tab" role="tab" id="t-tr" aria-controls="p-tr" aria-selected="false"><b>2</b>Тренування</button>
    <button class="tab" role="tab" id="t-ex" aria-controls="p-ex" aria-selected="false"><b>3</b>Контрольна</button>
  </nav>

  <section class="panel" id="p-th" role="tabpanel" aria-labelledby="t-th">
    <h2>Пояснення <span class="h2n">(обери тему, потім правило; «Далі» показує розв'язання по кроках)</span></h2>
    <div class="theory">
      <div class="topics" id="topics"></div>
      <div>
        <div class="props" id="thBody"></div>
        <div class="board" id="board"></div>
        <div class="bbtns"><button class="btn main" id="bNext">Далі ▶</button><button class="btn" id="bAll">Усе одразу</button><button class="btn" id="bReset">Спочатку</button></div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-tr" role="tabpanel" aria-labelledby="t-tr" hidden>
    <h2>Тренування <span class="h2n">(10 завдань, як у пробній контрольній; кнопка «Крок» пояснює розв'язання)</span></h2>
    <div id="tr"></div>
  </section>

  <section class="panel" id="p-ex" role="tabpanel" aria-labelledby="t-ex" hidden>
    <h2>Пробна контрольна <span class="h2n">(10 завдань, 12 балів)</span></h2>
    <div id="ex"></div>
  </section>
  <p class="author">© Сидорчук Н.В.</p>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* Куди надсилати результати пробної контрольної (FormSubmit.co). */
const TEACHER_EMAIL='snv.teacher@gmail.com';
const TITLE='Раціональні вирази (§§ 5–8)';
const KEY='rv8-';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a};
function plural(n,f1,f2,f5){const m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return f5;if(k===1)return f1;if(k>=2&&k<=4)return f2;return f5}
const baly=n=>n+' '+plural(n,'бал','бали','балів');
const fn=n=>(n<0?'−':'')+String(Math.abs(Math.round(n*1000)/1000)).replace('.',',');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAB=['А','Б','В','Г'];

/* ---------- запис математики: дроби лише з горизонтальною рискою ---------- */
const MI=s=>String(s).replace(/-/g,'−').replace(/[a-z]/g,'<i>$&</i>').replace(/\^(\d+|\{\d+\}|<i>[a-z]<\/i>)/g,'<sup>$1</sup>');
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const fr=(n,d)=>F(MI(n),MI(d));
const P=x=>`<span class="br">(</span>${x}<span class="br">)</span>`;
const PW=(x,n)=>`${P(x)}<sup class="hi">${n}</sup>`;
const MX=h=>`<span class="mx">${h}</span>`;
const mi=s=>MX(MI(s));
const pw=(L,e)=>e===1?L:L+'^'+e;
const mc=(c,s)=>(c===1&&s?'':c===-1&&s?'-':String(c))+s;
const sgn=n=>n<0?'-'+(-n):String(n);
const I=(l,a)=>({l,a});
const LS=['a','b','c','m','x','y','p'];
const PAIRS=[['a','m'],['a','b'],['x','y'],['m','c'],['p','k'],['c','n']];

/* ---------- генератори завдань ---------- */
const GEN={};
/* 1. множення */
GEN.mul=[[
  ()=>{const L=pick(LS),q=rnd(1,3),d=rnd(2,3),p=q+d;let A,B;do{A=rnd(2,9);B=rnd(2,9)}while(A===B||gcd(A,B)>1);
    return{title:'Множення дробів',text:'Виконай множення:',ex:fr(pw(L,p),A)+' · '+fr(B,pw(L,q)),
      tpl:fr(`{0}${L}^{1}`,'{2}'),inputs:[I('коефіцієнт',B),I('показник',d),I('знаменник',A)],
      steps:['Чисельник множимо на чисельник, знаменник — на знаменник: '+MX(fr(`${pw(L,p)} · ${B}`,`${A} · ${pw(L,q)}`)),
        `Скорочуємо на ${mi(pw(L,q))}: у чисельнику лишається ${mi(pw(L,d))}.`,'Відповідь: '+MX(fr(B+pw(L,d),A))]}},
  ()=>{const L=pick(LS),B=rnd(2,5),k=rnd(2,6),A=k*B,p=rnd(2,4),q=rnd(1,p-1),d=p-q;
    return{title:'Множення дробів',text:'Виконай множення:',ex:fr(A,pw(L,p))+' · '+fr(pw(L,q),B),
      tpl:fr('{0}',d>1?`${L}^{1}`:L),inputs:d>1?[I('чисельник',k),I('показник',d)]:[I('чисельник',k)],
      steps:['Чисельник множимо на чисельник, знаменник — на знаменник: '+MX(fr(`${A} · ${pw(L,q)}`,`${pw(L,p)} · ${B}`)),
        `Скорочуємо числа на ${B} (${A} і ${B}) і степені на ${mi(pw(L,q))}.`,'Відповідь: '+MX(fr(k,pw(L,d)))]}}],[
  ()=>{const [X,Y]=pick(PAIRS);let n1,d1,n2,d2,g,u,v;
    do{n1=rnd(1,9);d1=rnd(2,16);n2=rnd(1,9);d2=rnd(2,16);g=gcd(n1*n2,d1*d2);u=n1*n2/g;v=d1*d2/g}
    while(gcd(n1,d1)>1||gcd(n2,d2)>1||g<3||u>5||v<2||v>12);
    const e=rnd(2,3),k2=rnd(1,2),dk=rnd(1,2),k1=k2+dk,sg=pick([[1,-1],[-1,1],[-1,-1]]),s=sg[0]*sg[1];
    const f1=fr(mc(n1,pw(X,e)),d1+pw(Y,k1)),f2=fr(mc(n2,pw(Y,k2)),d2+pw(X,e));
    return{title:'Множення дробів',text:'Виконай множення:',ex:(sg[0]<0?'−':'')+f1+' · '+(sg[1]<0?P('−'+f2):f2),

        'Чисельник: '+mi(`${L}(${L} + ${k}) - ${L}(${L} - ${k}) = ${L}^2 + ${k}${L} - ${L}^2 + ${k}${L} = ${2*k}${L}`)+', тож дужка = '+MX(fr(`${2*k}${L}`,`${L}^2 - ${k*k}`))+'.',

const TYP={mul:'Множення',div:'Ділення',root:'Корінь рівняння',fac:'Множення з розкладанням',pow:'Степінь дробу',eq:'Рівняння',simp:'Спрощення виразу'};

      L_(PW(fr('a^2b','c^3'),10),'приклад'),L_('= '+fr('(a^2)^10 · b^10','(c^3)^10'),'кожен множник у степінь'),L_('= '+fr('a^20b^10','c^30'),'показники множимо: 2 · 10 = 20')]},

};

/* ---------- відповіді: шаблон + своя клавіатура ---------- */
const num=s=>{s=String(s).replace(/\s/g,'').replace(/[−–—]/g,'-').replace(',','.');return s===''||s==='-'?NaN:Number(s)};
const KP=`<div class="kp" aria-label="клавіатура">${['7','8','9','⌫','4','5','6','−','1','2','3','→','0'].map(k=>`<button type="button" data-k="${k}" class="${k==='0'?'w':k==='⌫'?'del':''}" aria-label="${k==='⌫'?'стерти':k==='→'?'наступне поле':k==='−'?'мінус':k}">${k==='→'?'→':k}</button>`).join('')}</div>`;
function tplHTML(t,pref,kp){return `<div class="in tpl mx">${t.tplLead||''}${fillT(t.tpl,i=>`<input id="${pref}i${i}" inputmode="none" autocomplete="off" aria-label="${t.inputs[i].l}">`)}</div>`+(kp?KP:'')}
function bindKP(box,after){const ins=[...box.querySelectorAll('.in input')];if(!ins.length)return;
  let act=null;const setAct=el=>{act=el;ins.forEach(i=>i.classList.toggle('act',i===el))};
  ins.forEach(i=>{i.addEventListener('focus',()=>setAct(i));i.addEventListener('click',()=>setAct(i))});setAct(ins.find(i=>i.value==='')||ins[0]);
  box.querySelectorAll('.kp [data-k]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.onclick=()=>{if(!act||act.readOnly)return;const k=b.dataset.k;let v=act.value.replace(/[−–—]/g,'-');
    if(k==='→'){setAct(ins[(ins.indexOf(act)+1)%ins.length]);return}
    if(k==='⌫')v=v.slice(0,-1);else if(k==='−')v=v.startsWith('-')?v.slice(1):'-'+v;
    else{if(v.replace('-','').length>=4)return;v=v.replace(/^(-?)0$/,'$1')+k}
    act.value=v.replace('-','−');act.classList.remove('ok','no');if(after)after()}})}
function choiceHTML(t,locked,reveal){return `<div class="opts">${t.opts.map((o,i)=>{const cl=(reveal&&i===t.ans)?'right':(i===t.wrongSel||(reveal&&i===t.sel&&i!==t.ans))?'wrong':'';
  return `<button data-c="${i}" aria-pressed="${t.sel===i}" class="${cl}" ${locked?'disabled':''}>${LAB[i]}. ${o}</button>`}).join('')}</div>`}
function judge(t){if(t.inputs){const m=t.inputs.map((x,i)=>Math.abs(num(t.vals[i])-x.a)<1e-6);return{ok:m.every(Boolean),marks:m,got:m.filter(Boolean).length}}
  return{ok:t.sel===t.ans}}
const ready=t=>t.inputs?t.vals.some(v=>v.trim()!==''):t.sel!==null;
function answerShow(t){if(t.inputs){t.vals=t.inputs.map(x=>fn(x.a));t.marks=t.inputs.map(()=>'ok')}if(t.opts)t.sel=t.ans}
function taskHTML(t,pref,locked,badge,extra){
  const body=t.inputs?tplHTML(t,pref,!locked):choiceHTML(t,locked,locked);
  return `<div class="task1"><h3>${t.title}${badge?` <span class="lvl">${badge}</span>`:''}</h3><p class="ttext">${t.text}</p><div class="expr mx">${t.ex}</div>${body}${extra||''}</div>`}
function bindTask(box,t,pref,locked,redraw,onEnter){
  if(t.inputs){const save=()=>{t.vals=t.inputs.map((_,i)=>$(pref+'i'+i).value);t.fb='';t.marks=null};
    t.inputs.forEach((_,i)=>{const el=$(pref+'i'+i);el.value=t.vals[i];if(t.marks)el.classList.add(t.marks[i]===true||t.marks[i]==='ok'?'ok':'no');
      if(locked)el.readOnly=true;else{el.oninput=save;if(onEnter)el.addEventListener('keydown',e=>{if(e.key==='Enter')onEnter()})}});
    if(!locked)bindKP(box,()=>{save();if(t.onChange)t.onChange()})}
  if(locked)return;
  if(t.opts)box.querySelectorAll('.opts [data-c]').forEach(b=>b.onclick=()=>{t.sel=+b.dataset.c;t.wrongSel=null;t.fb='';redraw()})}

/* ---------- 2. тренування ---------- */
let TR;
function trNew(){TR={tasks:PLAN().map(([y,l,p,lv])=>{const t=make(y,l,TRV[y+l],p,lv);TRV[y+l]=t.v;return t}),i:0};drawTR()}
function drawTR(){const box=$('tr');if(TR.i>=TR.tasks.length)return drawTRend();
  const t=TR.tasks[TR.i];
  const dots=TR.tasks.map((x,i)=>`<i class="${i===TR.i?'cur':x.solved?(x.shown?'no':x.help?'help':'ok'):''}" title="Завдання ${i+1}"></i>`).join('');
  const steps=t.hintN?`<ol class="steps">${t.steps.slice(0,t.hintN).map((s,i)=>`<li><b>Крок ${i+1}.</b> ${s}</li>`).join('')}</ol>`:'';
  box.innerHTML=`<div class="progress"><span>Завдання ${TR.i+1} з ${TR.tasks.length}</span><span>${TYP[t.type]} · рівень ${t.level}</span></div><div class="dots">${dots}</div>`+
    taskHTML(t,'r',t.solved,'',`${steps}<div id="trFb">${t.fb}</div><div class="row-btns" id="trBtns"></div>`);
  bindTask(box,t,'r',t.solved,drawTR,trCheck);
  const B=$('trBtns');
  B.insertAdjacentHTML('afterend',`<div class="row-btns"><button class="btn" id="trPrev" ${TR.i===0?'disabled':''}>← Назад</button><button class="btn" id="trFwd">${TR.i===TR.tasks.length-1?'Результат →':'Вперед →'}</button></div>`);
  const goTo=j=>{TR.i=j;drawTR();window.scrollTo(0,0)};
  $('trPrev').onclick=()=>{if(TR.i>0)goTo(TR.i-1)};$('trFwd').onclick=()=>goTo(TR.i+1);
  box.querySelectorAll('.dots i').forEach((d,j)=>d.onclick=()=>goTo(j));
  if(t.solved){B.innerHTML=`<button class="btn main" id="trNext">${TR.i===TR.tasks.length-1?'Результат':'Наступне завдання'}</button>`;$('trNext').onclick=()=>goTo(TR.i+1);return}
  B.innerHTML=`<button class="btn main" id="trCheck">Перевірити</button>`+(t.hintN<t.steps.length?`<button class="btn hint" id="trHint">Крок ${t.hintN+1} з ${t.steps.length}</button>`:'')+
    (t.wrong>=2||t.hintN>=t.steps.length?`<button class="btn" id="trShow">Показати відповідь</button>`:'');
  $('trCheck').onclick=trCheck;
  if($('trHint'))$('trHint').onclick=()=>{t.hintN++;drawTR()};
  if($('trShow'))$('trShow').onclick=()=>{t.solved=t.shown=true;t.hintN=t.steps.length;answerShow(t);
    t.fb=`<div class="fb info"><span class="ttl">Відповідь:</span>${t.sol}<br>Перечитай кроки — у контрольній буде схоже завдання.</div>`;drawTR()};
  t.onChange=()=>{$('trCheck').disabled=!ready(t)};$('trCheck').disabled=!ready(t)}
function trCheck(){const t=TR.tasks[TR.i];if(t.solved||!ready(t))return;const r=judge(t);
  if(t.inputs)t.marks=r.marks;
  if(r.ok){t.solved=true;t.help=t.hintN>0;t.hintN=t.steps.length;
    t.fb=`<div class="fb ok"><span class="ttl">${pick(['Чудово!','Правильно!','Так тримати!','Точно в ціль!'])}</span>${t.help?'Молодець, що розібрався з кроками.':'Ось покрокове розв\'язання — звір зі своїм.'}</div>`}
  else{t.wrong++;const empty=t.inputs&&t.vals.some(v=>v.trim()==='');
    let msg=t.inputs?(empty?'Заповни всі клітинки.':'Перевір червоні клітинки.'):'Ця відповідь неправильна.';
    if(t.hintN<t.steps.length){t.hintN++;msg+=` Подивись крок ${t.hintN}.`}
    if(t.opts){t.wrongSel=t.sel;t.sel=null}
    t.fb=`<div class="fb no"><span class="ttl">Ще не зовсім.</span>${msg}</div>`}
  drawTR()}
function drawTRend(){const n=TR.tasks.length,ok=TR.tasks.filter(t=>t.solved&&!t.shown&&!t.help).length,help=TR.tasks.filter(t=>t.help).length,sh=TR.tasks.filter(t=>t.shown).length;
  $('tr').innerHTML=`<div class="final"><div class="big">${ok} / ${n}</div><p>самостійно${help?`, ще ${help} — з кроками`:''}${sh?`, ${sh} — з показаною відповіддю`:''}.</p>
  <p>${ok>=8?'Блискуче! Можна писати пробну контрольну.':ok>=5?'Добре! Пройди ще одне тренування з новими числами або спробуй пробну контрольну.':'Перечитай Пояснення і пройди тренування ще раз: числа будуть нові.'}</p>
  <div class="row-btns" style="justify-content:center"><button class="btn main" id="trAgain">Нове тренування</button><button class="btn" id="trBack">← Назад до завдань</button><button class="btn" id="trExam">До контрольної</button></div></div>`;
  $('trBack').onclick=()=>{TR.i=TR.tasks.length-1;drawTR();window.scrollTo(0,0)};
  $('trAgain').onclick=()=>{trNew();window.scrollTo(0,0)};$('trExam').onclick=()=>openTab($('t-ex'))}
trNew();

/* ---------- 3. пробна контрольна ---------- */
let EX=null,STUD={n:'',c:''};
function exStart(){EX={tasks:PLAN().map(([y,l,p,lv])=>make(y,l,TRV[y+l],p,lv)),i:0,done:false,t0:Date.now()};drawEx()}
function exIntro(){$('ex').innerHTML=`<ul class="rules"><li>10 завдань: рівень 1 — №1–4, рівень 2 — №5–9, рівень 3 — №10. №6 і №10 — по 2 бали, решта — по 1 балу.</li>
  <li>Кроків і підказок немає. Між завданнями можна переходити й змінювати відповіді, доки не натиснеш «Здати роботу».</li><li>Оцінка = кількість балів (з 12).</li></ul>
  <div class="namebox"><label>Прізвище та ім'я<input id="exName" autocomplete="name" placeholder="Наприклад, Коваленко Марія"></label><label>Клас<input id="exClass" placeholder="8-А"></label></div>
  <button class="btn main" id="exGo">Почати контрольну</button><div id="exNameFb"></div>`;
  try{$('exName').value=localStorage.getItem(KEY+'name')||'';$('exClass').value=localStorage.getItem(KEY+'class')||''}catch(e){}
  $('exGo').onclick=()=>{const n=$('exName').value.trim(),c=$('exClass').value.trim();
    if(!n){$('exNameFb').innerHTML='<div class="fb no">Впиши прізвище та ім\'я, щоб учитель знав, чий це результат.</div>';$('exName').focus();return}
    STUD={n,c};try{localStorage.setItem(KEY+'name',n);localStorage.setItem(KEY+'class',c)}catch(e){}exStart();window.scrollTo(0,0)}}
function drawEx(){if(EX.done)return drawExRes();const t=EX.tasks[EX.i],box=$('ex'),last=EX.i===EX.tasks.length-1;
  box.innerHTML=`<div class="exbar">${EX.tasks.map((x,i)=>`<button data-j="${i}" class="${i===EX.i?'cur':ready(x)?'ans':''}" aria-label="Завдання ${i+1}">${i+1}</button>`).join('')}</div>
    <p class="lvhead">Рівень ${t.level} · завдання ${EX.i+1}</p>`+
    taskHTML(t,'e',false,baly(t.pts),`<div class="row-btns"><button class="btn" id="exPrev" ${EX.i===0?'disabled':''}>← Назад</button>${!last?'<button class="btn main" id="exNext">Далі →</button>':''}<button class="btn${last?' main':''}" id="exEnd">Здати роботу</button></div><div id="exFb"></div>`);
  t.onChange=()=>{const d=box.querySelector(`.exbar [data-j="${EX.i}"]`);if(d)d.className='cur'};
  bindTask(box,t,'e',false,drawEx);
  const go=j=>{EX.i=j;drawEx();window.scrollTo(0,0)};
  box.querySelectorAll('.exbar button').forEach(b=>b.onclick=()=>go(+b.dataset.j));
  $('exPrev').onclick=()=>go(EX.i-1);if($('exNext'))$('exNext').onclick=()=>go(EX.i+1);
  $('exEnd').onclick=()=>{const left=EX.tasks.filter(x=>!ready(x)).length;
    if(left&&!$('exSure')){$('exFb').innerHTML=`<div class="fb info"><span class="ttl">Без відповіді ${left} ${plural(left,'завдання','завдання','завдань')}.</span>Здати все одно?<div class="row-btns"><button class="btn main" id="exSure">Так, здати</button></div></div>`;
      $('exSure').onclick=exFinish;$('exFb').scrollIntoView({behavior:'smooth',block:'nearest'});return}
    exFinish()}}
function exFinish(){let total=0;EX.tasks.forEach(t=>{const r=judge(t);
    if(t.inputs){t.got=r.ok?t.pts:(r.got>0&&t.pts>1?1:0);t.marks=r.marks}else t.got=r.ok?t.pts:0;
    t.res=t.got===t.pts?'ok':t.got?'part':'no';total+=t.got});
  EX.score=total;EX.done=true;EX.min=Math.max(1,Math.round((Date.now()-EX.t0)/60000));EX.mail=!TEACHER_EMAIL?'off':location.protocol==='file:'?'local':'sending';drawExRes();window.scrollTo(0,0);mailRes()}
function revLine(t){if(t.res==='ok')return 'Правильно: '+t.sol;
  let mine;if(t.inputs)mine=t.vals.every(v=>v.trim()==='')?'—':MX((t.tplLead||'')+fillT(t.tpl,i=>`<span class="tv">${esc(t.vals[i].trim())||'?'}</span>`));
  else mine=t.sel===null?'—':t.opts[t.sel];
  return `Твоя відповідь: ${mine}<br>Правильно: ${t.sol}`}
const gradeOf=s=>Math.max(1,s);
function drawExRes(){const s=EX.score,grade=gradeOf(s);
  const msg=grade>=10?'Ти готовий до контрольної! Так тримати.':grade>=7?'Добрий результат. Потренуй завдання, де були помилки.':grade>=4?'Є над чим попрацювати: повтори Пояснення і пройди Тренування.':'Почни з Пояснення, а потім пройди Тренування з кроками.';
  $('ex').innerHTML=`<div class="final">${STUD.n?`<p><b>${esc(STUD.n)}${STUD.c?', '+esc(STUD.c):''}</b></p>`:''}<div class="big">${s} / 12</div><p><b>Оцінка: ${grade} ${plural(grade,'бал','бали','балів')} з 12</b> · час ${EX.min} хв</p><p>${msg}</p>
  <div class="row-btns" style="justify-content:center"><button class="btn main" id="exSend">Надіслати результат учителю</button><button class="btn" id="exAgain">Нова контрольна</button></div>
  <div id="mailSt">${mailStHTML()}</div></div>
  <h3>Розбір</h3><div class="review">${EX.tasks.map((t,i)=>`<div class="${t.res}"><b>${i+1}. ${TYP[t.type]}: ${t.got} з ${baly(t.pts)}</b>${revLine(t)}</div>`).join('')}</div>`;
  $('exAgain').onclick=exIntro;$('exSend').onclick=()=>shareRes(s,grade)}
function mailStHTML(){const m=EX.mail;
  if(m==='sending')return '<p class="note">Надсилаю результат учителю…</p>';
  if(m==='ok')return '<div class="fb ok"><span class="ttl">Результат автоматично надіслано вчителю.</span>Кнопкою вище можна ще й переслати його в месенджер.</div>';
  if(m==='local')return '<div class="fb info"><span class="ttl">Тренажер відкрито як файл, тому автоматично результат не надсилається.</span>Він надсилається сам, коли тренажер відкрито за посиланням з інтернету. Зараз натисни «Надіслати результат учителю» і перешли його в Viber чи Telegram.</div>';
  if(m==='activate')return '<div class="fb info"><span class="ttl">Пошту вчителя ще не активовано.</span>На неї надіслано лист з кнопкою «Activate Form». Цей результат перешли кнопкою вище.</div>';
  if(m==='fail')return '<div class="fb no"><span class="ttl">Не вдалося надіслати автоматично.</span>Натисни «Надіслати результат учителю» і перешли його в Viber чи Telegram.</div>';
  return '<p class="note">Кнопка відкриє Viber, Telegram чи інший месенджер з готовим повідомленням.</p>'}
const badList=()=>EX.tasks.map((t,i)=>t.res!=='ok'?`№${i+1} ${TYP[t.type]} (${t.got}/${t.pts})`:'').filter(Boolean);
async function mailRes(){if(EX.mail!=='sending')return;const s=EX.score,grade=gradeOf(s),bad=badList();
  try{const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(TEACHER_EMAIL),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({_subject:`Раціональні вирази: ${STUD.n}${STUD.c?', '+STUD.c:''}, оцінка ${grade}`,_template:'table',_captcha:'false',
        'Тема':`${TITLE}, пробна контрольна, 8 клас`,'Учень':STUD.n,'Клас':STUD.c||'—','Бали':`${s} з 12`,'Оцінка':`${grade} з 12`,'Помилки':bad.length?bad.join('; '):'немає','Час':`${EX.min} хв`,'Дата':new Date().toLocaleString('uk-UA')})});
    const j=await r.json().catch(()=>({}));EX.mail=(r.ok&&String(j.success)!=='false')?'ok':/activat/i.test(j.message||'')?'activate':'fail'}
  catch(e){EX.mail='fail'}
  if($('mailSt'))$('mailSt').innerHTML=mailStHTML()}
function resText(s,grade){const d=new Date(),pad=n=>String(n).padStart(2,'0'),bad=badList();
  return `Пробна контрольна «${TITLE}», 8 клас\nУчень: ${STUD.n||'—'}${STUD.c?', '+STUD.c:''}\nРезультат: ${s} з 12 балів, оцінка ${grade} з 12\n`+
    (bad.length?`Помилки: ${bad.join('; ')}\n`:'Без помилок!\n')+`Час: ${EX.min} хв, ${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
async function shareRes(s,grade){const text=resText(s,grade);
  if(navigator.share){try{await navigator.share({title:'Результат контрольної',text});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('Результат скопійовано. Встав його в чат учителя.')}
  catch(e){window.prompt('Скопіюй цей текст і надішли вчителю:',text)}}
exIntro();
try{const s=localStorage.getItem(KEY+'tab');if(s&&$(s))openTab($(s))}catch(e){}
</script>
